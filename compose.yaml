services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: agendazap
      POSTGRES_USER: agendazap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U agendazap']
      interval: 5s
      retries: 10
  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 8793
      BASE_PATH: /AgendaZap
      PUBLIC_ORIGIN: http://localhost:8793
      COOKIE_SECURE: 'false'
      DATABASE_URL: postgresql://agendazap:${POSTGRES_PASSWORD}@db:5432/agendazap
    ports:
      - '127.0.0.1:8793:8793'
    volumes:
      - agendazap-data:/app/data
volumes:
  postgres-data:
  agendazap-data:
