services:
  agendazap:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agendazap
    restart: unless-stopped
    ports:
      - "${AGENDAZAP_PORT:-8080}:80"
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
