services:
  agendazap:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agendazap
    restart: unless-stopped
    ports:
      - "${AGENDAZAP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
