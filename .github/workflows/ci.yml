name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Frontend JavaScript syntax
        run: |
          node --check app.js
          node --check service-worker.js

      - name: Validate JSON
        run: |
          python3 - <<'PY'
          import json
          for path in ("package.json", "manifest.webmanifest", "voice-service/package.json"):
              with open(path, encoding="utf-8") as f:
                  json.load(f)
              print(f"{path}: ok")
          PY

      - name: Install Voice AI dependencies
        working-directory: voice-service
        run: npm install --no-audit --no-fund

      - name: Check Voice AI syntax
        working-directory: voice-service
        run: npm run check

      - name: Test Voice AI stores
        working-directory: voice-service
        run: npm test

      - name: Build Voice AI container
        run: docker build -t agendazap-voice:ci ./voice-service

      - name: Smoke test Voice AI without API key
        run: |
          docker run -d --name agendazap-voice-ci -p 13001:3001 agendazap-voice:ci
          trap 'docker logs agendazap-voice-ci || true; docker rm -f agendazap-voice-ci || true' EXIT

          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:13001/healthz >/tmp/voice-health.json; then
              break
            fi
            sleep 1
          done

          python3 - <<'PY'
          import json
          with open("/tmp/voice-health.json", encoding="utf-8") as f:
              data=json.load(f)
          assert data["ok"] is True
          assert data["configured"] is False
          print("voice health: ok")
          PY

      - name: Build frontend container
        run: docker build -t agendazap:ci .

      - name: Validate Nginx
        run: docker run --rm agendazap:ci nginx -t

      - name: Validate compose
        run: docker compose config >/dev/null

      - name: Smoke test frontend container
        run: |
          docker run -d --name agendazap-ci -p 18080:80 agendazap:ci
          trap 'docker logs agendazap-ci || true; docker rm -f agendazap-ci || true' EXIT

          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18080/healthz | grep -q '^ok$'; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:18080/ >/dev/null
          curl -fsS http://127.0.0.1:18080/agenda >/dev/null
          curl -fsS http://127.0.0.1:18080/assets/icon-agendazap.svg >/dev/null

          curl -fsSI http://127.0.0.1:18080/app.js | grep -qi 'x-content-type-options: nosniff'
          curl -fsSI http://127.0.0.1:18080/app.js | grep -qi 'cache-control: no-cache'

          docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' agendazap-ci
