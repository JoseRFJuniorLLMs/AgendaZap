name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install AgendaZap dependencies
        run: npm ci --no-audit --no-fund

      - name: Check AgendaZap syntax
        run: npm run check

      - name: Install Voice AI dependencies
        working-directory: voice-service
        run: npm ci --no-audit --no-fund

      - name: Test AgendaZap
        run: npm test

      - name: Install Chromium for UI tests
        run: npx playwright install --with-deps chromium

      - name: Test AgendaZap UI
        run: npm run test:ui

      - name: Validate JSON
        run: |
          python3 - <<'PY'
          import json
          for path in ("package.json", "public/manifest.webmanifest", "voice-service/package.json"):
              with open(path, encoding="utf-8") as f:
                  json.load(f)
              print(f"{path}: ok")
          PY

      - name: Check Voice AI
        working-directory: voice-service
        run: |
          npm run check
          npm test

      - name: Build AgendaZap container
        run: docker build -t agendazap:ci .

      - name: Build Voice AI container
        run: docker build -t agendazap-voice:ci ./voice-service

      - name: Smoke test Voice AI without API key
        run: |
          docker run -d --name agendazap-voice-ci -p 13001:3001 agendazap-voice:ci
          trap 'docker logs agendazap-voice-ci || true; docker rm -f agendazap-voice-ci || true' EXIT

          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:13001/healthz >/tmp/voice-health.json; then
              break
            fi
            sleep 1
          done

          python3 - <<'PY'
          import json
          with open("/tmp/voice-health.json", encoding="utf-8") as f:
              data=json.load(f)
          assert data["ok"] is True
          assert data["configured"] is False
          PY

      - name: Validate deployment manifests
        env:
          POSTGRES_PASSWORD: validation-only-not-a-production-password
        run: |
          docker compose -f compose.yaml config >/dev/null
          test -f deploy/agendazap.service
          test -f deploy/nginx-agendazap.conf
          bash -n deploy/agendazap-auto-deploy.sh
          bash -n deploy/migrate-postgresql.sh
          python3 deploy/test-auto-deploy.py
