location = /AgendaZap { return 308 /AgendaZap/; }

location = /AgendaZap/api/voice/health {
    proxy_pass http://127.0.0.1:8794/api/voice/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /AgendaZap/_voice_auth {
    internal;
    proxy_pass http://127.0.0.1:8793/AgendaZap/api/voice-authorize;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Original-Method $voice_original_method;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
}

location ^~ /AgendaZap/api/voice/ {
    set $voice_original_method $request_method;
    auth_request /AgendaZap/_voice_auth;
    auth_request_set $voice_tenant $upstream_http_x_agendazap_tenant;
    proxy_set_header X-AgendaZap-Tenant $voice_tenant;
    include /etc/nginx/snippets/agendazap-voice-secret.conf;
    proxy_pass http://127.0.0.1:8794/api/voice/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    client_max_body_size 24m;
}

location ^~ /AgendaZap/ws/voice/ {
    set $voice_original_method $request_method;
    auth_request /AgendaZap/_voice_auth;
    auth_request_set $voice_tenant $upstream_http_x_agendazap_tenant;
    proxy_set_header X-AgendaZap-Tenant $voice_tenant;
    include /etc/nginx/snippets/agendazap-voice-secret.conf;
    proxy_pass http://127.0.0.1:8794/ws/voice/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 3600s;
}

location /AgendaZap/ {
    proxy_pass http://127.0.0.1:8793;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 40s;
    client_max_body_size 128k;
}
